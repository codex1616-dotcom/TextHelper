<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextHelper</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header><img src="icons/icon48.png" alt=""><div><strong>TextHelper</strong><small id="tagline"></small></div><div id="interface-language"></div><label class="enable"><input id="enabled" type="checkbox"><span id="enabled-label"></span></label></header>
<div class="preview-wrap"><div class="preview-heading"><span class="preview-label" id="preview-label"></span><button type="button" id="edit-placement"></button><button type="button" id="close-placement" hidden></button></div>
<div id="preview-stage"><div id="preview-guide-x" class="preview-guide vertical"></div><div id="preview-guide-y" class="preview-guide horizontal"></div><span id="preview-selection"></span><texthelper-preview id="preview-panel"></texthelper-preview><button type="button" id="preview-cursor"><svg aria-hidden="true" width="25" height="30" viewBox="0 0 25 30"><path d="M3 2v23l6-6 5 10 5-3-5-9h9Z" fill="#f9f6ff" stroke="#6c45ba" stroke-width="2" stroke-linejoin="round"/></svg><span id="preview-cursor-label"></span></button></div>
<p id="preview-hint" class="hint"></p><output id="preview-coordinates" hidden></output></div>
<nav id="tabs" aria-label="TextHelper"></nav><main id="content"></main><p id="status" role="status" aria-live="polite"></p>
<dialog id="review"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="Close">×</button></form><div id="review-content"></div></dialog>
<script src="catalogs.js"></script><script src="shared.js"></script><script src="theme-prompt.js"></script><script src="providers.js"></script><script src="panel-style.js"></script><script src="panel.js"></script><script src="settings.js"></script>
</body></html>
